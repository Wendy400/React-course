<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput() {
            return (
                <> {/* this is a frament, when theres no need for a div, this is preferred*/}
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30" />
                    <button>Send</button>
                </>
            )
        }


        // function ChatMessage(props) {
        // const message =props.message;
        //const sender=props.sender;

        // const {message, sender} = props

        function ChatMessage({ message, sender }) {


            /* if (sender =='robot')   {
                 return (
                 <div>
                 {message}
                 <img src="robot.png" width="50"/>
                 </div>
                 )}*/
            //this code is made simpler as below using a guard operator &&

            return (
                <div>
                    {sender == 'robot' && <img src="robot.png" width="50" />}
                    {message}
                    {sender == 'user' && <img src="user.png" width="50" />}
                </div>

            )
        }


        function App (){
            return (
                <>
                    <ChatInput />
                    <ChatMessage
                        message="hello chatbox"
                        sender="user" />
                    <ChatMessage
                        message="Hello! How can i help you"
                        sender="robot" />

                </>

            )
        }

       /* const app = (
            <>*/

                {/* {ChatInput ()}  ....>this is invoking the function directly
                <ChatInput></ChatInput>   .....>similar results to the first one but more preferred. 
                                               it iscomponent syntax, similar results as here below*/}
                /*<ChatInput />
                <ChatMessage
                    message="hello chatbox"
                    sender="user" />
                <ChatMessage
                    message="Hello! How can i help you"
                    sender="robot" />

            </>
        );*/

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
</body>

</html>
